name: schedule review

# Reviews pull requests that change the catalog, such as proposals from the playground: one comment kept up to date with
# the report and the week, the Schedule label while every changed schedule is valid, and a title named after the
# schedules while the pull request has GitHub's default ("Create night-shift.canned-schedule.md"). The flags come from
# canned-schedules.args on the base branch, so a pull request can't loosen its own check.
on:
  pull_request:
    paths:
      - schedules/*.canned-schedule.md

permissions:
  contents: read

concurrency:
  group: schedule-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # Job permissions replace the workflow's, so contents: read is repeated for the checkout.
    permissions:
      contents: read
      pull-requests: write # Renames the pull request.
      issues: write # Comments and labels go through the issues API.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The diff needs the base commit.
          persist-credentials: false

      - uses: iilei/canned-schedules-companion/review@bbbc63d29654db02af538f94b90694ba25ea6dc5 # v0.3.4
